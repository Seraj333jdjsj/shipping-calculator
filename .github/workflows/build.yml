name: Build Marafy Shipping System EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Scaffold and Build App
        shell: pwsh
        run: |
          npm create tauri-app@latest app -- --template react-ts -y
          cd app
          npm install

          # ضبط اسم وهوية التطبيق
          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.productName = "Marafy.seraj.systim"
          $conf.identifier = "com.marafy.seraj.systim"
          if ($conf.app.windows) {
            $conf.app.windows[0].title = "Marafy.seraj.systim"
          }
          $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath -Encoding UTF8

          @'
          import { useState, useEffect, ChangeEvent } from 'react';

          interface Package {
            id: number;
            qty: number;
            length: number;
            width: number;
            height: number;
            actualWeight: number;
          }

          interface AdditionalCharge {
            id: number;
            name: string;
            amount: number;
          }

          interface ShipmentRecord {
            id: string;
            refNo: string;
            date: string;
            clientName: string;
            companyName: string;
            phone: string;
            origin: string;
            destination: string;
            mode: 'AIR' | 'SEA';
            chargeableUnit: string;
            freightCost: number;
            additionalCost: number;
            total: number;
            currency: string;
          }

          function genRef() {
            const d = new Date();
            const pad = (n: number) => n.toString().padStart(2, '0');
            return `MRS-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${Math.floor(1000 + Math.random() * 9000)}`;
          }

          export default function App() {
            const [mode, setMode] = useState<'AIR' | 'SEA'>('AIR');
            const [currency, setCurrency] = useState<'USD' | 'LYD' | 'EUR'>('USD');
            const [logo, setLogo] = useState<string | null>(null);

            // بيانات العملية والعميل
            const [refNo, setRefNo] = useState(genRef());
            const [clientName, setClientName] = useState('');
            const [companyName, setCompanyName] = useState('');
            const [phone, setPhone] = useState('');
            const [origin, setOrigin] = useState('طرابلس (Tripoli)');
            const [destination, setDestination] = useState('');

            // إعدادات الشحن الجوي
            const [dimFactor, setDimFactor] = useState<number>(5000);
            const [freightRateAir, setFreightRateAir] = useState<number>(8);
            const [airPackages, setAirPackages] = useState<Package[]>([
              { id: 1, qty: 1, length: 50, width: 40, height: 30, actualWeight: 20 }
            ]);

            // إعدادات الشحن البحري المجزأ (LCL W/M)
            const [seaCbm, setSeaCbm] = useState<number>(3.5);
            const [seaWeightKg, setSeaWeightKg] = useState<number>(1200);
            const [seaRateWm, setSeaRateWm] = useState<number>(45);
            const [seaMinCbm, setSeaMinCbm] = useState<number>(1.0);

            // الرسوم الإضافية
            const [charges, setCharges] = useState<AdditionalCharge[]>([
              { id: 1, name: 'تخليص ومصاريف موانئ / مطار', amount: 150 }
            ]);

            // سجل العمليات والمحذوفات
            const [history, setHistory] = useState<ShipmentRecord[]>([]);
            const [trash, setTrash] = useState<ShipmentRecord[]>([]);
            const [msg, setMsg] = useState('');

            useEffect(() => {
              const savedLogo = localStorage.getItem('marafy_logo_img');
              if (savedLogo) setLogo(savedLogo);

              const savedHistory = localStorage.getItem('marafy_shipments_db');
              if (savedHistory) {
                try { setHistory(JSON.parse(savedHistory)); } catch {}
              }

              const savedTrash = localStorage.getItem('marafy_trash_db');
              if (savedTrash) {
                try { setTrash(JSON.parse(savedTrash)); } catch {}
              }
            }, []);

            useEffect(() => {
              localStorage.setItem('marafy_shipments_db', JSON.stringify(history));
            }, [history]);

            useEffect(() => {
              localStorage.setItem('marafy_trash_db', JSON.stringify(trash));
            }, [trash]);

            const handleLogo = (e: ChangeEvent<HTMLInputElement>) => {
              const file = e.target.files?.[0];
              if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                  const b64 = reader.result as string;
                  setLogo(b64);
                  localStorage.setItem('marafy_logo_img', b64);
                };
                reader.readAsDataURL(file);
              }
            };

            // إدارة الطرود الجوية
            const addAirPackage = () => {
              setAirPackages([...airPackages, { id: Date.now(), qty: 1, length: 10, width: 10, height: 10, actualWeight: 1 }]);
            };
            const removeAirPackage = (id: number) => {
              if (airPackages.length > 1) setAirPackages(airPackages.filter(p => p.id !== id));
            };
            const updateAirPackage = (id: number, field: keyof Package, value: number) => {
              setAirPackages(airPackages.map(p => p.id === id ? { ...p, [field]: value } : p));
            };

            // إدارة الرسوم
            const addCharge = () => {
              setCharges([...charges, { id: Date.now(), name: 'بند إضافي', amount: 0 }]);
            };
            const removeCharge = (id: number) => {
              setCharges(charges.filter(c => c.id !== id));
            };
            const updateCharge = (id: number, field: 'name' | 'amount', value: any) => {
              setCharges(charges.map(c => c.id === id ? { ...c, [field]: value } : c));
            };

            // الحسابات
            const totalAirActual = airPackages.reduce((sum, p) => sum + (p.actualWeight * p.qty), 0);
            const totalAirVolumetric = airPackages.reduce((sum, p) => {
              const vol = (p.length * p.width * p.height * p.qty) / (dimFactor || 5000);
              return sum + vol;
            }, 0);
            const airChargeable = Math.max(totalAirActual, totalAirVolumetric);
            const airFreightCost = airChargeable * freightRateAir;

            const seaWeightTons = (seaWeightKg || 0) / 1000;
            const seaBaseRevenueTon = Math.max(seaCbm || 0, seaWeightTons);
            const seaChargeableRT = Math.max(seaBaseRevenueTon, seaMinCbm || 0);
            const seaFreightCost = seaChargeableRT * seaRateWm;

            const currentFreightCost = mode === 'AIR' ? airFreightCost : seaFreightCost;
            const totalAdditionalCharges = charges.reduce((sum, c) => sum + Number(c.amount || 0), 0);
            const finalTotal = currentFreightCost + totalAdditionalCharges;

            // العمليات: حفظ، حذف، استعادة، تصدير
            const handleSave = () => {
              if (!clientName.trim()) {
                setMsg('⚠️ يرجى إدخال اسم العميل قبل الحفظ');
                return;
              }
              const newItem: ShipmentRecord = {
                id: Date.now().toString(),
                refNo,
                date: new Date().toLocaleDateString('ar-LY'),
                clientName,
                companyName,
                phone,
                origin,
                destination,
                mode,
                chargeableUnit: mode === 'AIR' ? `${airChargeable.toFixed(2)} KG` : `${seaChargeableRT.toFixed(2)} RT`,
                freightCost: currentFreightCost,
                additionalCost: totalAdditionalCharges,
                total: finalTotal,
                currency
              };
              setHistory([newItem, ...history.filter(h => h.refNo !== refNo)]);
              setMsg(`✓ تم حفظ الشحنة (${refNo}) بنجاح`);
              setRefNo(genRef());
              setTimeout(() => setMsg(''), 4000);
            };

            const handleDelete = (id: string) => {
              const item = history.find(x => x.id === id);
              if (!item) return;
              setHistory(history.filter(x => x.id !== id));
              setTrash([item, ...trash]);
            };

            const handleRestore = (id: string) => {
              const item = trash.find(x => x.id === id);
              if (!item) return;
              setTrash(trash.filter(x => x.id !== id));
              setHistory([item, ...history]);
            };

            const handleExport = () => {
              if (history.length === 0) {
                alert('لا توجد شحنات في السجل لتصديرها');
                return;
              }
              const headers = ['المرجع', 'التاريخ', 'اسم العميل', 'الشركة', 'الهاتف', 'خط السير', 'النوع', 'الوزن/الحجم المعتمد', 'تكلفة الشحن', 'المصاريف الإضافية', 'المبلغ الإجمالي', 'العملة'];
              const rows = history.map(h => [
                h.refNo,
                h.date,
                `"${h.clientName}"`,
                `"${h.companyName || '-'}"`,
                `"${h.phone || '-'}"`,
                `"${h.origin} -> ${h.destination || '-'}"`,
                h.mode === 'AIR' ? 'جوي (DIM)' : 'بحري (W/M)',
                h.chargeableUnit,
                h.freightCost.toFixed(2),
                h.additionalCost.toFixed(2),
                h.total.toFixed(2),
                h.currency
              ]);
              const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
              const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `Marafy_Shipments_${new Date().toISOString().slice(0, 10)}.csv`;
              a.click();
              URL.revokeObjectURL(url);
            };

            const handlePrint = () => {
              window.print();
            };

            const inputStyle: any = { width: '100%', padding: '8px', background: '#080f1e', border: '1px solid #1e293b', borderRadius: '6px', color: '#f8fafc', fontSize: '13px', boxSizing: 'border-box' };
            const cardStyle: any = { background: '#0e182e', padding: '16px', borderRadius: '10px', border: '1px solid #1e293b', marginBottom: '16px' };

            return (
              <div style={{ fontFamily: 'Segoe UI, Tahoma, sans-serif', padding: '20px', background: '#080f1e', minHeight: '100vh', color: '#f8fafc', direction: 'rtl' }}>
                
                {/* CSS مخصص للطباعة لإخراج فاتورة رسمية بيضاء نقية */}
                <style>{`
                  @media print {
                    body { background: #fff !important; color: #000 !important; }
                    .no-print { display: none !important; }
                    .print-only { display: block !important; }
                    .receipt-sheet { border: 2px solid #0f172a; padding: 24px; color: #000; direction: rtl; border-radius: 8px; }
                  }
                  @media screen {
                    .print-only { display: none; }
                  }
                `}</style>

                {/* --- نموذج الإيصال المخصص للطباعة فقط --- */}
                <div className="print-only receipt-sheet">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '2px solid #0f172a', paddingBottom: '14px', marginBottom: '16px' }}>
                    <div>
                      <h1 style={{ margin: 0, fontSize: '24px', color: '#0284c7' }}>Marafy.seraj.systim</h1>
                      <p style={{ margin: '4px 0 0', fontSize: '13px', color: '#475569' }}>شركة مرافيء للشحن والخدمات اللوجستية</p>
                    </div>
                    {logo && <img src={logo} alt="Logo" style={{ height: '55px', maxWidth: '220px', objectFit: 'contain' }} />}
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '14px', fontSize: '13px' }}>
                    <div><b>رقم المرجع:</b> {refNo}</div>
                    <div><b>التاريخ:</b> {new Date().toLocaleDateString('ar-LY')}</div>
                    <div><b>نوع الشحن:</b> {mode === 'AIR' ? 'شحن جوي / سريع (DIM)' : 'شحن بحري مجزأ (LCL W/M)'}</div>
                    <div><b>خط السير:</b> {origin} ➔ {destination || 'غير محدد'}</div>
                  </div>

                  <div style={{ background: '#f8fafc', border: '1px solid #cbd5e1', padding: '10px', borderRadius: '6px', marginBottom: '16px', fontSize: '13px' }}>
                    <div><b>اسم العميل:</b> {clientName || 'عميل نقدي'} {companyName ? `(${companyName})` : ''}</div>
                    {phone && <div><b>رقم الهاتف:</b> {phone}</div>}
                  </div>

                  <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: '16px', fontSize: '13px', textAlign: 'center' }}>
                    <thead>
                      <tr style={{ background: '#0f172a', color: '#fff' }}>
                        <th style={{ padding: '8px' }}>البيان</th>
                        <th style={{ padding: '8px' }}>التفاصيل المعتمدة</th>
                        <th style={{ padding: '8px' }}>المبلغ</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td style={{ border: '1px solid #cbd5e1', padding: '8px' }}>نولون الشحن الأساسي</td>
                        <td style={{ border: '1px solid #cbd5e1', padding: '8px' }}>
                          {mode === 'AIR' ? `الوزن المعتمد: ${airChargeable.toFixed(2)} KG` : `الطن الاحتسابي: ${seaChargeableRT.toFixed(2)} RT`}
                        </td>
                        <td style={{ border: '1px solid #cbd5e1', padding: '8px', fontWeight: 'bold' }}>{currentFreightCost.toFixed(2)} {currency}</td>
                      </tr>
                      {charges.map((c, i) => (
                        <tr key={i}>
                          <td style={{ border: '1px solid #cbd5e1', padding: '8px' }}>{c.name}</td>
                          <td style={{ border: '1px solid #cbd5e1', padding: '8px' }}>رسوم ومصاريف محلية</td>
                          <td style={{ border: '1px solid #cbd5e1', padding: '8px' }}>{Number(c.amount).toFixed(2)} {currency}</td>
                        </tr>
                      ))}
                      <tr style={{ background: '#f1f5f9', fontWeight: 'bold', fontSize: '15px' }}>
                        <td colSpan={2} style={{ border: '1px solid #cbd5e1', padding: '10px', textAlign: 'left' }}>المبلغ الإجمالي المستحق:</td>
                        <td style={{ border: '1px solid #cbd5e1', padding: '10px', color: '#0284c7' }}>{finalTotal.toFixed(2)} {currency}</td>
                      </tr>
                    </tbody>
                  </table>

                  <div style={{ marginTop: '30px', display: 'flex', justifyContent: 'space-between', fontSize: '12px', textAlign: 'center' }}>
                    <div>ختم وتوقيع الشركة: ___________________</div>
                    <div>توقيع المستلم: ___________________</div>
                  </div>
                </div>

                {/* --- واجهة لوحة التحكم التفاعلية على الشاشة --- */}
                <div className="no-print">
                  <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', background: '#0e182e', padding: '14px 20px', borderRadius: '12px', border: '1px solid #1e293b' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                      {logo ? (
                        <div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
                          <img src={logo} alt="Logo" style={{ height: '48px', maxWidth: '220px', objectFit: 'contain' }} />
                          <button onClick={() => { setLogo(null); localStorage.removeItem('marafy_logo_img'); }} style={{ position: 'absolute', top: '-6px', left: '-8px', background: '#ef4444', color: '#fff', border: 'none', borderRadius: '50%', width: '18px', height: '18px', fontSize: '10px', cursor: 'pointer' }}>✕</button>
                        </div>
                      ) : (
                        <label style={{ background: '#1e293b', padding: '8px 12px', borderRadius: '8px', fontSize: '11px', cursor: 'pointer', border: '1px dashed #38bdf8', color: '#38bdf8', fontWeight: 'bold' }}>
                          📷 رفع الشعار
                          <input type="file" accept="image/*" onChange={handleLogo} style={{ display: 'none' }} />
                        </label>
                      )}
                      <div style={{ borderRight: '1px solid #1e293b', paddingRight: '14px' }}>
                        <h1 style={{ margin: 0, fontSize: '22px', fontWeight: '800', color: '#38bdf8' }}>Marafy.seraj.systim</h1>
                        <p style={{ margin: '2px 0 0', color: '#94a3b8', fontSize: '11px' }}>نظام تسعير الشحنات الدولي (جوي وبحري LCL W/M)</p>
                      </div>
                    </div>

                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                      <select value={currency} onChange={e => setCurrency(e.target.value as any)} style={{ ...inputStyle, width: '90px' }}>
                        <option>USD</option><option>LYD</option><option>EUR</option>
                      </select>
                      <div style={{ display: 'flex', gap: '4px', background: '#080f1e', padding: '4px', borderRadius: '8px' }}>
                        <button onClick={() => setMode('AIR')} style={{ padding: '8px 14px', borderRadius: '6px', border: 'none', cursor: 'pointer', fontWeight: 'bold', fontSize: '12px', background: mode === 'AIR' ? '#0284c7' : 'transparent', color: mode === 'AIR' ? '#fff' : '#94a3b8' }}>✈️ جوي (DIM)</button>
                        <button onClick={() => setMode('SEA')} style={{ padding: '8px 14px', borderRadius: '6px', border: 'none', cursor: 'pointer', fontWeight: 'bold', fontSize: '12px', background: mode === 'SEA' ? '#0284c7' : 'transparent', color: mode === 'SEA' ? '#fff' : '#94a3b8' }}>🚢 بحري (W/M)</button>
                      </div>
                    </div>
                  </header>

                  {msg && <div style={{ background: msg.includes('✓') ? '#065f46' : '#7f1d1d', padding: '10px', borderRadius: '8px', marginBottom: '16px', fontSize: '13px' }}>{msg}</div>}

                  {/* 1. بيانات العميل والعملية */}
                  <div style={cardStyle}>
                    <h3 style={{ margin: '0 0 12px', fontSize: '14px', color: '#38bdf8' }}>1. بيانات العميل والعملية</h3>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(170px, 1fr))', gap: '10px' }}>
                      <div><label style={{ fontSize: '11px', color: '#94a3b8' }}>المرجع Ref No</label><input style={inputStyle} value={refNo} readOnly /></div>
                      <div><label style={{ fontSize: '11px', color: '#94a3b8' }}>اسم العميل *</label><input style={inputStyle} placeholder="الاسم" value={clientName} onChange={e => setClientName(e.target.value)} /></div>
                      <div><label style={{ fontSize: '11px', color: '#94a3b8' }}>اسم الشركة</label><input style={inputStyle} placeholder="الشركة" value={companyName} onChange={e => setCompanyName(e.target.value)} /></div>
                      <div><label style={{ fontSize: '11px', color: '#94a3b8' }}>الهاتف</label><input style={inputStyle} placeholder="الهاتف" value={phone} onChange={e => setPhone(e.target.value)} /></div>
                      <div><label style={{ fontSize: '11px', color: '#94a3b8' }}>المنشأ Origin</label><input style={inputStyle} value={origin} onChange={e => setOrigin(e.target.value)} /></div>
                      <div><label style={{ fontSize: '11px', color: '#94a3b8' }}>الوجهة Destination</label><input style={inputStyle} placeholder="ميناء/مطار الوجهة" value={destination} onChange={e => setDestination(e.target.value)} /></div>
                    </div>
                  </div>

                  {/* 2. حاسبة الأوزان والحجم */}
                  {mode === 'AIR' ? (
                    <>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '16px', marginBottom: '16px' }}>
                        <div style={cardStyle}>
                          <label style={{ display: 'block', fontSize: '12px', color: '#94a3b8', marginBottom: '6px' }}>معامل الحجم (DIM Factor)</label>
                          <select value={dimFactor} onChange={e => setDimFactor(Number(e.target.value))} style={inputStyle}>
                            <option value={5000}>5000 (شحن جوي وتجاري قياسي)</option>
                            <option value={6000}>6000 (بريد سريع وشركات محددة)</option>
                          </select>
                        </div>
                        <div style={cardStyle}>
                          <label style={{ display: 'block', fontSize: '12px', color: '#94a3b8', marginBottom: '6px' }}>سعر الكيلو ({currency} / kg)</label>
                          <input type="number" value={freightRateAir} onChange={e => setFreightRateAir(Number(e.target.value))} style={inputStyle} />
                        </div>
                      </div>

                      <div style={cardStyle}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                          <h3 style={{ margin: 0, fontSize: '14px', color: '#e2e8f0' }}>بيانات الطرود الجوية</h3>
                          <button onClick={addAirPackage} style={{ background: '#0284c7', color: '#fff', border: 'none', padding: '6px 12px', borderRadius: '6px', cursor: 'pointer' }}>+ إضافة طرد</button>
                        </div>
                        <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'center', fontSize: '13px' }}>
                          <thead>
                            <tr style={{ background: '#1e293b', color: '#cbd5e1' }}>
                              <th style={{ padding: '6px' }}>العدد</th>
                              <th style={{ padding: '6px' }}>الطول (cm)</th>
                              <th style={{ padding: '6px' }}>العرض (cm)</th>
                              <th style={{ padding: '6px' }}>الارتفاع (cm)</th>
                              <th style={{ padding: '6px' }}>وزن القطعة (kg)</th>
                              <th style={{ padding: '6px' }}>الحجمي</th>
                              <th style={{ padding: '6px' }}>حذف</th>
                            </tr>
                          </thead>
                          <tbody>
                            {airPackages.map(p => {
                              const pVol = (p.length * p.width * p.height * p.qty) / (dimFactor || 5000);
                              return (
                                <tr key={p.id} style={{ borderBottom: '1px solid #1e293b' }}>
                                  <td style={{ padding: '6px' }}><input type="number" value={p.qty} onChange={e => updateAirPackage(p.id, 'qty', Number(e.target.value))} style={{ width: '50px', ...inputStyle, textAlign: 'center' }} /></td>
                                  <td style={{ padding: '6px' }}><input type="number" value={p.length} onChange={e => updateAirPackage(p.id, 'length', Number(e.target.value))} style={{ width: '60px', ...inputStyle, textAlign: 'center' }} /></td>
                                  <td style={{ padding: '6px' }}><input type="number" value={p.width} onChange={e => updateAirPackage(p.id, 'width', Number(e.target.value))} style={{ width: '60px', ...inputStyle, textAlign: 'center' }} /></td>
                                  <td style={{ padding: '6px' }}><input type="number" value={p.height} onChange={e => updateAirPackage(p.id, 'height', Number(e.target.value))} style={{ width: '60px', ...inputStyle, textAlign: 'center' }} /></td>
                                  <td style={{ padding: '6px' }}><input type="number" value={p.actualWeight} onChange={e => updateAirPackage(p.id, 'actualWeight', Number(e.target.value))} style={{ width: '60px', ...inputStyle, textAlign: 'center' }} /></td>
                                  <td style={{ padding: '6px', color: '#38bdf8' }}>{pVol.toFixed(2)} kg</td>
                                  <td style={{ padding: '6px' }}><button onClick={() => removeAirPackage(p.id)} style={{ background: '#ef4444', color: '#fff', border: 'none', padding: '4px 8px', borderRadius: '4px', cursor: 'pointer' }}>✕</button></td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </>
                  ) : (
                    <div style={cardStyle}>
                      <h3 style={{ margin: '0 0 14px', fontSize: '15px', color: '#e2e8f0' }}>بيانات الشحنة البحرية (Weight or Measurement - W/M)</h3>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '12px' }}>
                        <div>
                          <label style={{ display: 'block', fontSize: '12px', color: '#94a3b8', marginBottom: '6px' }}>الحجم الكلي (CBM)</label>
                          <input type="number" step="0.01" value={seaCbm} onChange={e => setSeaCbm(Number(e.target.value))} style={inputStyle} />
                        </div>
                        <div>
                          <label style={{ display: 'block', fontSize: '12px', color: '#94a3b8', marginBottom: '6px' }}>الوزن الإجمالي (KG)</label>
                          <input type="number" value={seaWeightKg} onChange={e => setSeaWeightKg(Number(e.target.value))} style={inputStyle} />
                          <span style={{ fontSize: '11px', color: '#64748b' }}>= {seaWeightTons.toFixed(3)} MT</span>
                        </div>
                        <div>
                          <label style={{ display: 'block', fontSize: '12px', color: '#94a3b8', marginBottom: '6px' }}>سعر النولون ({currency} / W/M)</label>
                          <input type="number" value={seaRateWm} onChange={e => setSeaRateWm(Number(e.target.value))} style={inputStyle} />
                        </div>
                        <div>
                          <label style={{ display: 'block', fontSize: '12px', color: '#94a3b8', marginBottom: '6px' }}>الحد الأدنى (Min CBM)</label>
                          <input type="number" step="0.1" value={seaMinCbm} onChange={e => setSeaMinCbm(Number(e.target.value))} style={inputStyle} />
                        </div>
                      </div>
                    </div>
                  )}

                  {/* 3. المصاريف الإضافية */}
                  <div style={cardStyle}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                      <h3 style={{ margin: 0, fontSize: '14px', color: '#e2e8f0' }}>المصاريف الإضافية والمحلية</h3>
                      <button onClick={addCharge} style={{ background: '#0284c7', color: '#fff', border: 'none', padding: '4px 10px', borderRadius: '6px', fontSize: '12px', cursor: 'pointer' }}>+ إضافة رسم</button>
                    </div>
                    {charges.map(c => (
                      <div key={c.id} style={{ display: 'flex', gap: '8px', marginBottom: '6px' }}>
                        <input type="text" value={c.name} onChange={e => updateCharge(c.id, 'name', e.target.value)} placeholder="اسم الرسم" style={{ ...inputStyle, flex: 2 }} />
                        <input type="number" value={c.amount} onChange={e => updateCharge(c.id, 'amount', Number(e.target.value))} placeholder="المبلغ" style={{ ...inputStyle, flex: 1 }} />
                        <button onClick={() => removeCharge(c.id)} style={{ background: '#ef4444', color: '#fff', border: 'none', padding: '4px 10px', borderRadius: '4px', cursor: 'pointer' }}>✕</button>
                      </div>
                    ))}
                  </div>

                  {/* بطاقات الإجمالي */}
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '14px', marginBottom: '16px' }}>
                    {mode === 'AIR' ? (
                      <>
                        <div style={cardStyle}>
                          <div style={{ fontSize: '12px', color: '#94a3b8' }}>الوزن الفعلي</div>
                          <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{totalAirActual.toFixed(2)} kg</div>
                        </div>
                        <div style={cardStyle}>
                          <div style={{ fontSize: '12px', color: '#94a3b8' }}>الوزن الحجمي</div>
                          <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{totalAirVolumetric.toFixed(2)} kg</div>
                        </div>
                        <div style={{ ...cardStyle, background: '#0284c7' }}>
                          <div style={{ fontSize: '12px', color: '#e0f2fe' }}>الوزن المعتمد</div>
                          <div style={{ fontSize: '20px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{airChargeable.toFixed(2)} kg</div>
                        </div>
                      </>
                    ) : (
                      <>
                        <div style={cardStyle}>
                          <div style={{ fontSize: '12px', color: '#94a3b8' }}>الحجم CBM</div>
                          <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{seaCbm.toFixed(2)} CBM</div>
                        </div>
                        <div style={cardStyle}>
                          <div style={{ fontSize: '12px', color: '#94a3b8' }}>الوزن بالطن MT</div>
                          <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{seaWeightTons.toFixed(3)} MT</div>
                        </div>
                        <div style={{ ...cardStyle, background: '#0284c7' }}>
                          <div style={{ fontSize: '12px', color: '#e0f2fe' }}>الطن الاحتسابي (RT)</div>
                          <div style={{ fontSize: '20px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{seaChargeableRT.toFixed(2)} RT</div>
                        </div>
                      </>
                    )}

                    <div style={cardStyle}>
                      <div style={{ fontSize: '12px', color: '#94a3b8' }}>النولون الأساسي</div>
                      <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{currentFreightCost.toFixed(2)} {currency}</div>
                    </div>

                    <div style={{ ...cardStyle, border: '2px solid #22c55e' }}>
                      <div style={{ fontSize: '12px', color: '#86efac' }}>المبلغ الإجمالي (TOTAL)</div>
                      <div style={{ fontSize: '22px', fontWeight: 'bold', color: '#4ade80', marginTop: '4px' }}>{finalTotal.toFixed(2)} {currency}</div>
                    </div>
                  </div>

                  {/* أزرار العمليات */}
                  <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', marginBottom: '20px' }}>
                    <button onClick={handleSave} style={{ background: '#0284c7', color: '#fff', border: 'none', padding: '10px 18px', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold' }}>
                      💾 حفظ في السجل
                    </button>
                    <button onClick={handlePrint} style={{ background: '#10b981', color: '#fff', border: 'none', padding: '10px 18px', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold' }}>
                      🖨️ طباعة إيصال الزبون
                    </button>
                    <button onClick={handleExport} style={{ background: '#6366f1', color: '#fff', border: 'none', padding: '10px 18px', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold' }}>
                      📊 تصدير كشف الشحنات (Excel / CSV)
                    </button>
                    <button onClick={() => setRefNo(genRef())} style={{ background: '#334155', color: '#fff', border: 'none', padding: '10px 14px', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold' }}>
                      🔄 مرجع جديد
                    </button>
                  </div>

                  {/* 4. جدول قاعدة البيانات وسجل الشحنات */}
                  <div style={cardStyle}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                      <h3 style={{ margin: 0, fontSize: '15px', color: '#38bdf8' }}>سجل الشحنات والزبائن المحفوظة ({history.length})</h3>
                      <span style={{ fontSize: '11px', color: '#94a3b8' }}>قاعدة بيانات داخلية تعمل دون إنترنت (Offline)</span>
                    </div>
                    <div style={{ overflowX: 'auto' }}>
                      <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'center', fontSize: '12px' }}>
                        <thead>
                          <tr style={{ background: '#1e293b', color: '#cbd5e1' }}>
                            <th style={{ padding: '8px' }}>المرجع</th>
                            <th style={{ padding: '8px' }}>التاريخ</th>
                            <th style={{ padding: '8px' }}>العميل</th>
                            <th style={{ padding: '8px' }}>المسار</th>
                            <th style={{ padding: '8px' }}>النوع</th>
                            <th style={{ padding: '8px' }}>الوزن/الحجم</th>
                            <th style={{ padding: '8px' }}>الإجمالي</th>
                            <th style={{ padding: '8px' }}>إجراء</th>
                          </tr>
                        </thead>
                        <tbody>
                          {history.length === 0 && (
                            <tr><td colSpan={8} style={{ padding: '16px', color: '#64748b' }}>لا يوجد سجل محفوظ بعد</td></tr>
                          )}
                          {history.map((h) => (
                            <tr key={h.id} style={{ borderBottom: '1px solid #1e293b' }}>
                              <td style={{ padding: '8px', fontWeight: 'bold', color: '#38bdf8' }}>{h.refNo}</td>
                              <td style={{ padding: '8px' }}>{h.date}</td>
                              <td style={{ padding: '8px' }}>{h.clientName} {h.companyName ? `(${h.companyName})` : ''}</td>
                              <td style={{ padding: '8px' }}>{h.origin} ➔ {h.destination || '-'}</td>
                              <td style={{ padding: '8px' }}>{h.mode === 'AIR' ? 'جوي' : 'بحري W/M'}</td>
                              <td style={{ padding: '8px' }}>{h.chargeableUnit}</td>
                              <td style={{ padding: '8px', color: '#4ade80', fontWeight: 'bold' }}>{h.total.toFixed(2)} {h.currency}</td>
                              <td style={{ padding: '8px' }}>
                                <button onClick={() => handleDelete(h.id)} style={{ background: '#ef4444', color: '#fff', border: 'none', padding: '4px 10px', borderRadius: '4px', cursor: 'pointer' }}>حذف</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    {/* المحذوفات القابلة للاسترجاع */}
                    {trash.length > 0 && (
                      <div style={{ marginTop: '16px', background: '#1e293b', padding: '12px', borderRadius: '8px', border: '1px solid #eab308' }}>
                        <b style={{ color: '#facc15', fontSize: '13px' }}>سلة المحذوفات (قابلة للاستعادة):</b>
                        <div style={{ marginTop: '8px', display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                          {trash.map(t => (
                            <span key={t.id} style={{ display: 'inline-flex', gap: '6px', alignItems: 'center', background: '#080f1e', border: '1px solid #eab308', padding: '4px 10px', borderRadius: '16px', fontSize: '12px' }}>
                              {t.refNo} - {t.clientName}
                              <button onClick={() => handleRestore(t.id)} style={{ background: '#eab308', color: '#000', border: 'none', padding: '2px 8px', borderRadius: '10px', cursor: 'pointer', fontWeight: 'bold' }}>استعادة</button>
                            </span>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          }
          '@ | Set-Content src/App.tsx -Encoding UTF8

          npm run tauri build

      - name: Upload Installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: Marafy.seraj.systim-Setup-EXE
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/*.exe
