name: Build Marafy Shipping System EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Scaffold and Build App
        shell: pwsh
        run: |
          npm create tauri-app@latest app -- --template react-ts -y
          cd app
          npm install

          # ضبط اسم وهوية التطبيق
          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.productName = "Marafy.seraj.systim"
          $conf.identifier = "com.marafy.seraj.systim"
          if ($conf.app.windows) {
            $conf.app.windows[0].title = "Marafy.seraj.systim"
          }
          $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath -Encoding UTF8

          @'
          import { useState, useEffect, ChangeEvent } from 'react';

          interface Package {
            id: number;
            qty: number;
            length: number;
            width: number;
            height: number;
            actualWeight: number;
          }

          interface AdditionalCharge {
            id: number;
            name: string;
            amount: number;
          }

          export default function App() {
            const [mode, setMode] = useState<'AIR' | 'SEA'>('AIR');
            const [currency, setCurrency] = useState<'USD' | 'LYD' | 'EUR'>('USD');
            const [logo, setLogo] = useState<string | null>(null);

            useEffect(() => {
              const saved = localStorage.getItem('marafy_logo_img');
              if (saved) setLogo(saved);
            }, []);

            const handleLogo = (e: ChangeEvent<HTMLInputElement>) => {
              const file = e.target.files?.[0];
              if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                  const b64 = reader.result as string;
                  setLogo(b64);
                  localStorage.setItem('marafy_logo_img', b64);
                };
                reader.readAsDataURL(file);
              }
            };

            // إعدادات الجوي
            const [dimFactor, setDimFactor] = useState<number>(5000);
            const [freightRateAir, setFreightRateAir] = useState<number>(8);
            const [airPackages, setAirPackages] = useState<Package[]>([
              { id: 1, qty: 2, length: 50, width: 40, height: 30, actualWeight: 20 }
            ]);

            // إعدادات البحري (LCL W/M)
            const [seaCbm, setSeaCbm] = useState<number>(3.5);
            const [seaWeightKg, setSeaWeightKg] = useState<number>(1200);
            const [seaRateWm, setSeaRateWm] = useState<number>(45);
            const [seaMinCbm, setSeaMinCbm] = useState<number>(1.0);

            // الرسوم الإضافية
            const [charges, setCharges] = useState<AdditionalCharge[]>([
              { id: 1, name: 'تخليص ومصاريف موانئ / مطار', amount: 150 }
            ]);

            const addAirPackage = () => {
              setAirPackages([...airPackages, { id: Date.now(), qty: 1, length: 10, width: 10, height: 10, actualWeight: 1 }]);
            };
            const removeAirPackage = (id: number) => {
              if (airPackages.length > 1) setAirPackages(airPackages.filter(p => p.id !== id));
            };
            const updateAirPackage = (id: number, field: keyof Package, value: number) => {
              setAirPackages(airPackages.map(p => p.id === id ? { ...p, [field]: value } : p));
            };

            const addCharge = () => {
              setCharges([...charges, { id: Date.now(), name: 'بند إضافي', amount: 0 }]);
            };
            const removeCharge = (id: number) => {
              setCharges(charges.filter(c => c.id !== id));
            };
            const updateCharge = (id: number, field: 'name' | 'amount', value: any) => {
              setCharges(charges.map(c => c.id === id ? { ...c, [field]: value } : c));
            };

            // حسابات الجوي
            const totalAirActual = airPackages.reduce((sum, p) => sum + (p.actualWeight * p.qty), 0);
            const totalAirVolumetric = airPackages.reduce((sum, p) => {
              const vol = (p.length * p.width * p.height * p.qty) / (dimFactor || 5000);
              return sum + vol;
            }, 0);
            const airChargeable = Math.max(totalAirActual, totalAirVolumetric);
            const airFreightCost = airChargeable * freightRateAir;

            // حسابات البحري (W/M)
            const seaWeightTons = (seaWeightKg || 0) / 1000;
            const seaBaseRevenueTon = Math.max(seaCbm || 0, seaWeightTons);
            const seaChargeableRT = Math.max(seaBaseRevenueTon, seaMinCbm || 0);
            const seaFreightCost = seaChargeableRT * seaRateWm;

            const currentFreightCost = mode === 'AIR' ? airFreightCost : seaFreightCost;
            const totalAdditionalCharges = charges.reduce((sum, c) => sum + Number(c.amount || 0), 0);
            const finalTotal = currentFreightCost + totalAdditionalCharges;

            const inputStyle: any = { width: '100%', padding: '8px', background: '#080f1e', border: '1px solid #1e293b', borderRadius: '6px', color: '#f8fafc', fontSize: '13px', boxSizing: 'border-box' };
            const cardStyle: any = { background: '#0e182e', padding: '16px', borderRadius: '10px', border: '1px solid #1e293b', marginBottom: '16px' };

            return (
              <div style={{ fontFamily: 'Segoe UI, Tahoma, sans-serif', padding: '24px', background: '#080f1e', minHeight: '100vh', color: '#f8fafc', direction: 'rtl' }}>
                
                {/* الرأس مع اسم Marafy.seraj.systim وخانة الشعار */}
                <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', background: '#0e182e', padding: '14px 20px', borderRadius: '12px', border: '1px solid #1e293b' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                    {logo ? (
                      <div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
                        <img src={logo} alt="Logo" style={{ height: '48px', maxWidth: '220px', objectFit: 'contain' }} />
                        <button onClick={() => { setLogo(null); localStorage.removeItem('marafy_logo_img'); }} style={{ position: 'absolute', top: '-6px', left: '-8px', background: '#ef4444', color: '#fff', border: 'none', borderRadius: '50%', width: '18px', height: '18px', fontSize: '10px', cursor: 'pointer' }}>✕</button>
                      </div>
                    ) : (
                      <label style={{ background: '#1e293b', padding: '8px 12px', borderRadius: '8px', fontSize: '11px', cursor: 'pointer', border: '1px dashed #38bdf8', color: '#38bdf8', fontWeight: 'bold' }}>
                        📷 رفع الشعار
                        <input type="file" accept="image/*" onChange={handleLogo} style={{ display: 'none' }} />
                      </label>
                    )}
                    <div style={{ borderRight: '1px solid #1e293b', paddingRight: '14px' }}>
                      <h1 style={{ margin: 0, fontSize: '22px', fontWeight: '800', color: '#38bdf8' }}>Marafy.seraj.systim</h1>
                      <p style={{ margin: '2px 0 0', color: '#94a3b8', fontSize: '11px' }}>نظام تسعير الشحنات الدولي (جوي وبحري LCL W/M)</p>
                    </div>
                  </div>

                  <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                    <select value={currency} onChange={e => setCurrency(e.target.value as any)} style={{ ...inputStyle, width: '90px' }}>
                      <option>USD</option><option>LYD</option><option>EUR</option>
                    </select>
                    <div style={{ display: 'flex', gap: '4px', background: '#080f1e', padding: '4px', borderRadius: '8px' }}>
                      <button onClick={() => setMode('AIR')} style={{ padding: '8px 14px', borderRadius: '6px', border: 'none', cursor: 'pointer', fontWeight: 'bold', fontSize: '12px', background: mode === 'AIR' ? '#0284c7' : 'transparent', color: mode === 'AIR' ? '#fff' : '#94a3b8' }}>✈️ جوي (DIM)</button>
                      <button onClick={() => setMode('SEA')} style={{ padding: '8px 14px', borderRadius: '6px', border: 'none', cursor: 'pointer', fontWeight: 'bold', fontSize: '12px', background: mode === 'SEA' ? '#0284c7' : 'transparent', color: mode === 'SEA' ? '#fff' : '#94a3b8' }}>🚢 بحري (W/M)</button>
                    </div>
                  </div>
                </header>

                {mode === 'AIR' ? (
                  <>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '16px', marginBottom: '16px' }}>
                      <div style={cardStyle}>
                        <label style={{ display: 'block', fontSize: '12px', color: '#94a3b8', marginBottom: '6px' }}>معامل الحجم (DIM Factor)</label>
                        <select value={dimFactor} onChange={e => setDimFactor(Number(e.target.value))} style={inputStyle}>
                          <option value={5000}>5000 (شحن جوي قياسي)</option>
                          <option value={6000}>6000 (بريد سريع)</option>
                        </select>
                      </div>
                      <div style={cardStyle}>
                        <label style={{ display: 'block', fontSize: '12px', color: '#94a3b8', marginBottom: '6px' }}>سعر الكيلو ({currency} / kg)</label>
                        <input type="number" value={freightRateAir} onChange={e => setFreightRateAir(Number(e.target.value))} style={inputStyle} />
                      </div>
                    </div>

                    <div style={cardStyle}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                        <h3 style={{ margin: 0, fontSize: '14px', color: '#e2e8f0' }}>بيانات الطرود الجوية</h3>
                        <button onClick={addAirPackage} style={{ background: '#0284c7', color: '#fff', border: 'none', padding: '6px 12px', borderRadius: '6px', cursor: 'pointer' }}>+ إضافة طرد</button>
                      </div>
                      <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'center', fontSize: '13px' }}>
                        <thead>
                          <tr style={{ background: '#1e293b', color: '#cbd5e1' }}>
                            <th style={{ padding: '6px' }}>العدد</th>
                            <th style={{ padding: '6px' }}>الطول (cm)</th>
                            <th style={{ padding: '6px' }}>العرض (cm)</th>
                            <th style={{ padding: '6px' }}>الارتفاع (cm)</th>
                            <th style={{ padding: '6px' }}>وزن القطعة (kg)</th>
                            <th style={{ padding: '6px' }}>الحجمي</th>
                            <th style={{ padding: '6px' }}>حذف</th>
                          </tr>
                        </thead>
                        <tbody>
                          {airPackages.map(p => {
                            const pVol = (p.length * p.width * p.height * p.qty) / (dimFactor || 5000);
                            return (
                              <tr key={p.id} style={{ borderBottom: '1px solid #1e293b' }}>
                                <td style={{ padding: '6px' }}><input type="number" value={p.qty} onChange={e => updateAirPackage(p.id, 'qty', Number(e.target.value))} style={{ width: '50px', ...inputStyle, textAlign: 'center' }} /></td>
                                <td style={{ padding: '6px' }}><input type="number" value={p.length} onChange={e => updateAirPackage(p.id, 'length', Number(e.target.value))} style={{ width: '60px', ...inputStyle, textAlign: 'center' }} /></td>
                                <td style={{ padding: '6px' }}><input type="number" value={p.width} onChange={e => updateAirPackage(p.id, 'width', Number(e.target.value))} style={{ width: '60px', ...inputStyle, textAlign: 'center' }} /></td>
                                <td style={{ padding: '6px' }}><input type="number" value={p.height} onChange={e => updateAirPackage(p.id, 'height', Number(e.target.value))} style={{ width: '60px', ...inputStyle, textAlign: 'center' }} /></td>
                                <td style={{ padding: '6px' }}><input type="number" value={p.actualWeight} onChange={e => updateAirPackage(p.id, 'actualWeight', Number(e.target.value))} style={{ width: '60px', ...inputStyle, textAlign: 'center' }} /></td>
                                <td style={{ padding: '6px', color: '#38bdf8' }}>{pVol.toFixed(2)} kg</td>
                                <td style={{ padding: '6px' }}><button onClick={() => removeAirPackage(p.id)} style={{ background: '#ef4444', color: '#fff', border: 'none', padding: '4px 8px', borderRadius: '4px', cursor: 'pointer' }}>✕</button></td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </>
                ) : (
                  <div style={cardStyle}>
                    <h3 style={{ margin: '0 0 14px', fontSize: '15px', color: '#e2e8f0' }}>بيانات الشحنة البحرية (Weight or Measurement - W/M)</h3>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '12px' }}>
                      <div>
                        <label style={{ display: 'block', fontSize: '12px', color: '#94a3b8', marginBottom: '6px' }}>الحجم الكلي (CBM)</label>
                        <input type="number" step="0.01" value={seaCbm} onChange={e => setSeaCbm(Number(e.target.value))} style={inputStyle} />
                      </div>
                      <div>
                        <label style={{ display: 'block', fontSize: '12px', color: '#94a3b8', marginBottom: '6px' }}>الوزن الإجمالي (KG)</label>
                        <input type="number" value={seaWeightKg} onChange={e => setSeaWeightKg(Number(e.target.value))} style={inputStyle} />
                        <span style={{ fontSize: '11px', color: '#64748b' }}>= {seaWeightTons.toFixed(3)} MT</span>
                      </div>
                      <div>
                        <label style={{ display: 'block', fontSize: '12px', color: '#94a3b8', marginBottom: '6px' }}>سعر النولون ({currency} / W/M)</label>
                        <input type="number" value={seaRateWm} onChange={e => setSeaRateWm(Number(e.target.value))} style={inputStyle} />
                      </div>
                      <div>
                        <label style={{ display: 'block', fontSize: '12px', color: '#94a3b8', marginBottom: '6px' }}>الحد الأدنى (Min CBM)</label>
                        <input type="number" step="0.1" value={seaMinCbm} onChange={e => setSeaMinCbm(Number(e.target.value))} style={inputStyle} />
                      </div>
                    </div>
                  </div>
                )}

                <div style={cardStyle}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                    <h3 style={{ margin: 0, fontSize: '14px', color: '#e2e8f0' }}>المصاريف الإضافية والمحلية</h3>
                    <button onClick={addCharge} style={{ background: '#0284c7', color: '#fff', border: 'none', padding: '4px 10px', borderRadius: '6px', fontSize: '12px', cursor: 'pointer' }}>+ إضافة رسم</button>
                  </div>
                  {charges.map(c => (
                    <div key={c.id} style={{ display: 'flex', gap: '8px', marginBottom: '6px' }}>
                      <input type="text" value={c.name} onChange={e => updateCharge(c.id, 'name', e.target.value)} placeholder="اسم الرسم" style={{ ...inputStyle, flex: 2 }} />
                      <input type="number" value={c.amount} onChange={e => updateCharge(c.id, 'amount', Number(e.target.value))} placeholder="المبلغ" style={{ ...inputStyle, flex: 1 }} />
                      <button onClick={() => removeCharge(c.id)} style={{ background: '#ef4444', color: '#fff', border: 'none', padding: '4px 10px', borderRadius: '4px', cursor: 'pointer' }}>✕</button>
                    </div>
                  ))}
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '14px' }}>
                  {mode === 'AIR' ? (
                    <>
                      <div style={cardStyle}>
                        <div style={{ fontSize: '12px', color: '#94a3b8' }}>الوزن الفعلي</div>
                        <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{totalAirActual.toFixed(2)} kg</div>
                      </div>
                      <div style={cardStyle}>
                        <div style={{ fontSize: '12px', color: '#94a3b8' }}>الوزن الحجمي</div>
                        <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{totalAirVolumetric.toFixed(2)} kg</div>
                      </div>
                      <div style={{ ...cardStyle, background: '#0284c7' }}>
                        <div style={{ fontSize: '12px', color: '#e0f2fe' }}>الوزن المعتمد</div>
                        <div style={{ fontSize: '20px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{airChargeable.toFixed(2)} kg</div>
                      </div>
                    </>
                  ) : (
                    <>
                      <div style={cardStyle}>
                        <div style={{ fontSize: '12px', color: '#94a3b8' }}>الحجم CBM</div>
                        <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{seaCbm.toFixed(2)} CBM</div>
                      </div>
                      <div style={cardStyle}>
                        <div style={{ fontSize: '12px', color: '#94a3b8' }}>الوزن بالطن MT</div>
                        <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{seaWeightTons.toFixed(3)} MT</div>
                      </div>
                      <div style={{ ...cardStyle, background: '#0284c7' }}>
                        <div style={{ fontSize: '12px', color: '#e0f2fe' }}>الطن الاحتسابي (RT)</div>
                        <div style={{ fontSize: '20px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{seaChargeableRT.toFixed(2)} RT</div>
                        <div style={{ fontSize: '10px', color: '#e0f2fe', marginTop: '2px' }}>{seaCbm >= seaWeightTons ? 'حجمي (Measurement)' : 'وزني (Weight)'}</div>
                      </div>
                    </>
                  )}

                  <div style={cardStyle}>
                    <div style={{ fontSize: '12px', color: '#94a3b8' }}>النولون الأساسي</div>
                    <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#fff', marginTop: '4px' }}>{currentFreightCost.toFixed(2)} {currency}</div>
                  </div>

                  <div style={{ ...cardStyle, border: '2px solid #22c55e' }}>
                    <div style={{ fontSize: '12px', color: '#86efac' }}>المبلغ الإجمالي (TOTAL)</div>
                    <div style={{ fontSize: '22px', fontWeight: 'bold', color: '#4ade80', marginTop: '4px' }}>{finalTotal.toFixed(2)} {currency}</div>
                  </div>
                </div>
              </div>
            );
          }
          '@ | Set-Content src/App.tsx -Encoding UTF8

          npm run tauri build

      - name: Upload Installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: Marafy.seraj.systim-Setup-EXE
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/*.exe
