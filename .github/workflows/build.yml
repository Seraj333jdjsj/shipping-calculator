name: Build Shipping Calculator EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Scaffold and Build App V2
        shell: pwsh
        run: |
          npm create tauri-app@latest app -- --template react-ts -y
          cd app
          npm install
          npm install jspdf @tauri-apps/api
          npm install @tauri-apps/plugin-sql @tauri-apps/plugin-dialog @tauri-apps/plugin-fs
          
          # تثبيت بلجنز Rust
          npx tauri add sql
          npx tauri add dialog
          npx tauri add fs
          
          # هنا سيتم استبدال src/App.tsx بالكود المطور V2
          # الكود المطور تجده جاهز في رسالتي السابقة - انسخه الى src/App.tsx قبل الرفع
          # اذا استخدمت هذه الطريقة السريعة بدون رفع الكود، سيبني النسخة V1 الأساسية
          
          npm run tauri build

      - name: Upload Installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: ShippingCalculator-Setup-EXE
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/*.exe
